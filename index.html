<!DOCTYPE html>
<html lang="en" id="site-html">
<head>
    <meta charset="UTF-8">
    <title>Exhibition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Helvetica+Neue:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --text-color: #f0f0f0;
            --dim-text: #9a9a9a;
            --accent: #d4af37;
            --frame-bg: #f4f1ea;
            --mouse-x: 50vw;
            --mouse-y: 30vh;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            overflow-x: hidden;
            padding: 50px;
        }

        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            z-index: 1;
        }

        .spotlight-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(circle 240px at var(--mouse-x) var(--mouse-y), rgba(0, 0, 0, 0) 0%, rgba(7, 7, 7, 0.82) 65%, rgba(4, 4, 4, 0.96) 100%);
            z-index: 2;
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 3;
            margin-bottom: 60px;
        }

        .pill-btn {
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 8px 22px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .pill-btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .hero-section {
            text-align: center;
            position: relative;
            z-index: 3;
            margin-bottom: 90px;
        }

        .exhibition-subtitle {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--text-color);
            max-width: 750px;
            margin: 0 auto;
            line-height: 1.5;
            font-style: italic;
        }

        .gallery-grid {
            display: flex;
            justify-content: center;
            gap: 50px;
            position: relative;
            z-index: 3;
        }

        .art-box {
            width: 290px;
            height: 390px;
            cursor: pointer;
            position: relative;
        }

        .moving-container {
            width: 100%;
            height: 100%;
            animation: floatBoxes 6s ease-in-out infinite alternate;
        }

        .art-box:nth-child(2) .moving-container {
            animation-delay: -2s;
        }

        .art-box:nth-child(3) .moving-container {
            animation-delay: -4s;
        }

        .museum-frame {
            background-color: var(--frame-bg);
            padding: 14px 14px 40px 14px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .art-box:hover .museum-frame {
            transform: translateY(-6px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8);
        }

        .museum-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(15%) contrast(105%);
            transition: filter 0.4s ease;
        }

        .art-box:hover img {
            filter: grayscale(0%) contrast(100%);
        }

        @keyframes floatBoxes {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-12px) rotate(0.4deg); }
        }

        .expanded-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 5, 0.97);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        .expanded-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            display: flex;
            width: 85vw;
            height: 80vh;
            gap: 70px;
            align-items: center;
        }

        .modal-frame {
            background-color: var(--frame-bg);
            padding: 20px 20px 55px 20px;
            width: 50%;
            height: 85%;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .modal-text-pane {
            width: 50%;
            color: var(--text-color);
        }

        .modal-text-pane h3 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2.6rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .modal-date {
            color: var(--dim-text);
            font-size: 0.95rem;
            letter-spacing: 3px;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .typewriter-text {
            font-size: 1.15rem;
            line-height: 1.85;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        [dir="rtl"] {
            direction: rtl;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="grain-overlay"></div>
    <div class="spotlight-overlay"></div>

    <header class="gallery-header">
        <div class="music-control">Audio Player</div>
        <button id="hebrew-toggle" class="pill-btn" onclick="toggleHebrew()">עברית</button>
    </header>

    <section class="hero-section">
        <h2 class="exhibition-subtitle" data-en="First of its kind exhibition exploring antizionism as Jew-hatred" data-he="תערוכה ראשונה מסוגה החוקרת את האנטי-ציונות כשנאת יהודים">
            First of its kind exhibition exploring antizionism as Jew-hatred
        </h2>
    </section>

    <main class="gallery-grid">
        <div class="art-box" onclick="expandPiece(this)" 
             data-name-en="Piece Title One" data-name-he="כותרת יצירה אחת"
             data-date-en="2026" data-date-he="2026"
             data-bio-en="Biographical and historical context for the first piece goes here in clean minimalist prose." data-bio-he="הקשר ביוגרפי והיסטורי ליצירה הראשונה מופיע כאן בפרוזה מינימליסטית נקייה.">
            <div class="moving-container">
                <div class="museum-frame">
                    <img src="image1.jpg" alt="Exhibition Piece">
                </div>
            </div>
        </div>
        
        <div class="art-box" onclick="expandPiece(this)" 
             data-name-en="Piece Title Two" data-name-he="כותרת יצירה שתיים"
             data-date-en="2026" data-date-he="2026"
             data-bio-en="Biographical and historical context for the second piece goes here." data-bio-he="הקשר ביוגרפי והיסטורי ליצירה השנייה מופיע כאן.">
            <div class="moving-container">
                <div class="museum-frame">
                    <img src="image2.jpg" alt="Exhibition Piece">
                </div>
            </div>
        </div>

        <div class="art-box" onclick="expandPiece(this)" 
             data-name-en="Piece Title Three" data-name-he="כותרת יצירה שלוש"
             data-date-en="2026" data-date-he="2026"
             data-bio-en="Biographical and historical context for the third piece goes here." data-bio-he="הקשר ביוגרפי והיסטורי ליצירה השלישית מופיע כאן.">
            <div class="moving-container">
                <div class="museum-frame">
                    <img src="image3.jpg" alt="Exhibition Piece">
                </div>
            </div>
        </div>
    </main>

    <div id="expanded-view" class="expanded-modal" onclick="closeExpanded(event)">
        <div class="modal-content">
            <div class="modal-frame">
                <img id="modal-img" src="" alt="Zoomed Piece">
            </div>
            <div class="modal-text-pane">
                <h3 id="modal-title"></h3>
                <p id="modal-date" class="modal-date"></p>
                <div id="modal-bio" class="typewriter-text"></div>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'en';

        window.addEventListener('mousemove', (e) => {
            document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
            document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
        });

        function toggleHebrew() {
            const htmlTag = document.getElementById('site-html');
            const toggleBtn = document.getElementById('hebrew-toggle');
            const subtitle = document.querySelector('.exhibition-subtitle');

            if (currentLang === 'en') {
                currentLang = 'he';
                htmlTag.setAttribute('dir', 'rtl');
                toggleBtn.innerText = 'English';
                subtitle.innerText = subtitle.getAttribute('data-he');
            } else {
                currentLang = 'en';
                htmlTag.removeAttribute('dir');
                toggleBtn.innerText = 'עברית';
                subtitle.innerText = subtitle.getAttribute('data-en');
            }
        }

        function expandPiece(element) {
            const modal = document.getElementById('expanded-view');
            const modalImg = document.getElementById('modal-img');
            const modalTitle = document.getElementById('modal-title');
            const modalDate = document.getElementById('modal-date');
            const modalBio = document.getElementById('modal-bio');

            const imgSrc = element.querySelector('img').src;
            const title = element.getAttribute(`data-name-${currentLang}`);
            const date = element.getAttribute(`data-date-${currentLang}`);
            const bio = element.getAttribute(`data-bio-${currentLang}`);

            modalImg.src = imgSrc;
            modalTitle.innerText = title;
            modalDate.innerText = date;
            modalBio.innerHTML = '';

            modal.classList.add('active');

            let i = 0;
            function typeWriter() {
                if (i < bio.length) {
                    modalBio.innerHTML += bio.charAt(i);
                    i++;
                    setTimeout(typeWriter, 22);
                }
            }
            typeWriter();
        }

        function closeExpanded(event) {
            if (event.target.id === 'expanded-view') {
                document.getElementById('expanded-view').classList.remove('active');
            }
        }
    </script>
</body>
</html>
